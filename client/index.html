<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Reader</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Still required by iOS; Chrome wants the unprefixed name above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="status" role="status" aria-live="polite"></div>

    <section id="library" hidden>
      <header>
        <h1>Library</h1>
        <div class="actions">
          <button id="add" type="button">Add book</button>
          <button id="rescan" type="button">Rescan</button>
        </div>
      </header>
      <!-- Opened from the Add button. The only way in on a phone, where there
           is nothing to drag from. -->
      <input id="picker" type="file" accept=".epub,application/epub+zip" multiple hidden />
      <ul id="shelf"></ul>
    </section>

    <section id="reader" hidden>
      <foliate-view id="view"></foliate-view>

      <div id="chrome">
        <button id="back" type="button">‹ Library</button>
        <div class="spacer"></div>
        <button id="toc-btn" type="button" aria-label="Contents and search">Contents</button>
        <button id="display-btn" type="button" aria-label="Display settings">
          <span aria-hidden="true">A</span><span class="big" aria-hidden="true">A</span>
        </button>
      </div>

      <button id="prev" class="nav" type="button" aria-label="Previous page">‹</button>
      <button id="next" class="nav" type="button" aria-label="Next page">›</button>

      <footer id="bar"><span id="label"></span><span id="pct"></span></footer>

      <aside id="contents" class="panel" hidden aria-label="Contents and search">
        <div class="panel-head">
          <input type="search" placeholder="Search this book" aria-label="Search this book" />
          <button class="panel-close" type="button" aria-label="Close">×</button>
        </div>
        <p class="panel-note"></p>
        <div class="panel-list"></div>
      </aside>

      <aside id="display" class="panel" hidden aria-label="Display settings"></aside>

      <div id="footnote" hidden role="dialog" aria-label="Note">
        <button class="panel-close" type="button" aria-label="Close note">×</button>
        <div id="footnote-body"></div>
      </div>

      <div id="scrim" hidden></div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
